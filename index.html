@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,201,105,.6)}70%{box-shadow:0 0 0 12px rgba(245,201,105,0)}100%{box-shadow:0 0 0 0 rgba(245,201,105,0)}}
.hud{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto;background:rgba(6,21,30,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;font-size:12px;color:#dfe9f3}

.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.hotcard{position:absolute;right:12px;bottom:10px;width:min(320px,calc(100% - 24px));background:rgba(8,26,38,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(126,219,201,.5);border-radius:18px;padding:16px 18px;box-shadow:0 18px 50px -10px rgba(0,0,0,.85);font-size:13px;color:#dfe9f3;z-index:3}

@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}

.hotcard .x{position:absolute;right:8px;top:6px;min-height:30px;width:30px;padding:0;border-radius:50%;background:transparent;font-size:14px}

[['อะไรเป็นตัวกำหนดชนิดธาตุ?','What defines an element?'],['จำนวนโปรตอนเป็นตัวกำหนดชนิดธาตุ เลขอะตอม Z = จำนวนโปรตอน เลขมวล A = โปรตอน + นิวตรอน','The proton count defines the element. Atomic number Z = protons. Mass number A = protons + neutrons.'],['อะตอมเป็นกลางมีโปรตอนเท่ากับอิเล็กตรอน ไอโซโทปของธาตุเดียวกันมีโปรตอนเท่ากันแต่นิวตรอนต่างกัน แบบจำลองนี้ไม่บอกความเสถียรของนิวเคลียส','A neutral atom has equal proton and electron counts. Isotopes share a proton count but differ in neutron count. This model does not predict nuclear stability.']],
[['อ่านตำแหน่งธาตุ','Read an element’s position'],['ตารางธาตุเรียงตามเลขอะตอม หมู่เป็นแนวตั้ง 18 หมู่ คาบเป็นแนวนอน 7 คาบ ตารางย่อนี้แสดงธาตุ 20 ธาตุแรก โดยเว้นตำแหน่งหมู่ที่ยังไม่มีธาตุในช่วงนี้','The periodic table is ordered by atomic number: 18 vertical groups and 7 horizontal periods. This excerpt shows the first 20 elements, leaving other positions empty.'],['สัญลักษณ์ขึ้นต้นด้วยตัวพิมพ์ใหญ่ ตัวที่สองถ้ามีเป็นตัวพิมพ์เล็ก เช่น Co ไม่ใช่ CO ซึ่งเป็นสูตรคาร์บอนมอนอกไซด์','Symbols start with an uppercase letter; any second letter is lowercase. Co differs from CO, the formula for carbon monoxide.']],
[['อย่าสับสนจำนวนอะตอมกับชนิดธาตุ','Count atom types, not just atoms'],['โมเลกุลเป็นกลุ่มอะตอมที่ยึดกันและมีประจุรวมเป็นศูนย์ O₂ เป็นโมเลกุลของธาตุ ส่วน H₂O เป็นโมเลกุลของสารประกอบ','A molecule is a bonded group of atoms with no net charge. O₂ is a molecule of an element; H₂O is a molecule of a compound.'],['ไอออนเป็นอะตอมหรือกลุ่มอะตอมที่มีประจุ ในตัวอย่างนี้ Na⁺ เสียอิเล็กตรอน 1 ตัว และ Cl⁻ รับอิเล็กตรอน 1 ตัว','An ion is a charged atom or group of atoms. Here, Na⁺ has lost one electron and Cl⁻ has gained one electron.']],
[['อ่านสูตรให้เป็น','Read a chemical formula'],['เลขห้อยบอกจำนวนอะตอมของธาตุในหนึ่งโมเลกุล หากไม่มีเลขห้อยหมายถึง 1 ส่วนสัมประสิทธิ์หน้าสูตรคูณทั้งสูตร','A subscript gives an atom count in one molecule; an omitted subscript means 1. A coefficient multiplies the entire formula.'],['NaCl เป็นโครงผลึกไอออนิก ไม่ใช่โมเลกุลเดี่ยว สูตรบอกอัตราส่วน Na⁺ : Cl⁻ = 1 : 1 ภาพตาข่ายเป็นเพียงส่วนหนึ่งของผลึกสามมิติ','NaCl forms an ionic lattice, not separate molecules. Its formula gives Na⁺ : Cl⁻ = 1 : 1. The grid represents a small part of a three-dimensional crystal.']],
[['แยกสารด้วยวิธีใด?','How can substances be separated?'],['สารผสมแยกองค์ประกอบได้ด้วยวิธีทางกายภาพที่เหมาะสม เช่น กลั่นหรือระเหย ตัวสารประกอบต้องเปลี่ยนแปลงทางเคมีจึงแยกเป็นสารอื่นได้','Mixture components can be separated by suitable physical methods, such as distillation or evaporation. Decomposing a compound requires a chemical change.'],['น้ำเกลือเป็นสารผสมเนื้อเดียว การกรองธรรมดาแยกเกลือที่ละลายแล้วไม่ได้ ส่วนการแยกน้ำด้วยไฟฟ้าเป็นการเปลี่ยนแปลงทางเคมี','Salt solution is a homogeneous mixture. Ordinary filtration cannot remove dissolved salt. Electrolysis of water is a chemical change.']],
[['อะตอมไม่หายไปไหน','Atoms are conserved'],['ปฏิกิริยาเคมีจัดเรียงอะตอมใหม่ ในระบบปิดมวลรวมก่อนและหลังเท่ากัน และจำนวนอะตอมของแต่ละธาตุคงเดิม','Chemical reactions rearrange atoms. In a closed system, total mass and the number of atoms of each element are conserved.'],['ปรับเฉพาะสัมประสิทธิ์เพื่อดุลสมการ ห้ามเปลี่ยนเลขห้อย เพราะจะเปลี่ยนชนิดสาร การจำลองนี้ไม่ได้แสดงกลไกปฏิกิริยาจริง','Balance equations by changing coefficients, not subscripts, which would change the substances. This simulation does not show the actual reaction mechanism.']]
];
function renderLearn(){let i=s.chapter,d=textLessons[i];$('main').innerHTML=`<div class="layout"><aside>${chapters.map((c,j)=>`<button class="${i===j?'active':''}" onclick="chapter(${j})"><span>${String(j+1).padStart(2,'0')}</span>${tr(c)} ${s.done.includes(j)?'✓':''}</button>`).join('')}<div class="note">${t('เรียนแล้ว','Reviewed')} ${s.done.length}/7</div></aside><article><div class="eyebrow">LESSON ${i+1} / 7</div><h2>${tr(chapters[i])}</h2>${card(tr(d[0]),tr(d[1]))}${note(...d[2])}<section class="lab"><div class="labhead"><h3>${t('ทดลองและสังเกต','Explore & observe')}</h3><button onclick="paused=!paused;document.body.classList.toggle('paused',paused);this.textContent=paused?t('▶ เคลื่อนไหว','▶ Animate'):t('Ⅱ หยุดภาพ','Ⅱ Pause')">${paused?t('▶ เคลื่อนไหว','▶ Animate'):t('Ⅱ หยุดภาพ','Ⅱ Pause')}</button></div><div id="controls"></div><div id="sim"></div></section><div class="actions"><button class="primary" onclick="markRead()">${t('เรียนบทนี้แล้ว ✓','Mark as reviewed ✓')}</button><button onclick="s.mission=${i*2};go('mission')">${t('ทำภารกิจของบทนี้ →','Chapter missions →')}</button>${i<6?`<button onclick="chapter(${i+1})">${t('บทถัดไป →','Next lesson →')}</button>`:''}</div><p class="muted">${t('ภาพเป็นแบบจำลองเชิงแนวคิด สีและขนาดไม่ใช่สีหรือสัดส่วนจริงของอนุภาค','Conceptual models: colours and sizes are not actual particle colours or scales.')}</p></article></div>`;let controls='';if(i===0)controls=`<select aria-label="${t('ตัวอย่างสาร','Substance sample')}" onchange="lab.sample=+this.value;updateSim()">${samples.map((a,j)=>`<option value="${j}" ${lab.sample===j?'selected':''}>${tr(a)}</option>`).join('')}</select>`;if(i===1)controls=slider('p',t('โปรตอน','Protons'),1,20)+slider('n',t('นิวตรอน','Neutrons'),0,24)+slider('e',t('อิเล็กตรอน','Electrons'),0,20);if(i===3)controls=select('particle',['He','O2','O3','H2O','Na+','Cl−'].map(x=>[x,x]));if(i===4)controls=select('formula',['H2O','CO2','NH3','NaCl'].map(x=>[x,x]))+slider('count',t('สัมประสิทธิ์','Coefficient'),1,6);if(i===5)controls=select('method',[['evap',t('ระเหยน้ำเกลือ','Evaporate salt solution')],['filter',t('กรองน้ำเกลือ','Filter salt solution')],['distill',t('กลั่นน้ำเกลือ','Distil salt solution')],['electro',t('แยกน้ำด้วยไฟฟ้า','Electrolyse water')]]);if(i===6)controls=slider('a','H₂',1,4)+slider('b','O₂',1,4)+slider('c','H₂O',1,4);$('controls').innerHTML=controls;updateSim()}
function markRead(){if(!s.done.includes(s.chapter))s.done.push(s.chapter);save();renderLearn()}
function lattice(){return svg(Array.from({length:24},(_,i)=>atom(70+i%6*90,45+Math.floor(i/6)*58,(i%6+Math.floor(i/6))%2?'Cl−':'Na+',22)).join(''),t('ส่วนของโครงผลึก NaCl','Part of a NaCl lattice'))}
function updateSim(){for(const k of ['p','n','e','count','a','b','c'])if($('val-'+k))$('val-'+k).textContent=lab[k];let i=s.chapter,h='';if(i===0){let a=samples[lab.sample];h=particles(a[3])+`<div class="result">${cat(a[2])}</div>`+note(a[2]==='element'?'มีอะตอมเพียงชนิดเดียว แม้อาจจับกันเป็นโมเลกุล':'compound'===a[2]?'มีธาตุต่างชนิดรวมกันทางเคมีในอัตราส่วนคงที่':'มีสารหลายชนิดปะปนกัน อัตราส่วนเปลี่ยนได้',a[2]==='element'?'One kind of atom, whether separate or bonded.':a[2]==='compound'?'Different elements chemically combined in a fixed ratio.':'Different substances coexist; proportions can vary.');if(a[3]==='air')h+=note('แสดงเฉพาะ N₂ และ O₂ เพื่อเปรียบเทียบ ไม่ใช่สัดส่วนอากาศจริง','Only N₂ and O₂ are shown; this is not the exact composition of air.')}
if(i===1){let el=elems[lab.p-1],charge=lab.p-lab.e,draw=`<circle cx="300" cy="130" r="53" fill="#203750"/><text x="300" y="123" fill="white" text-anchor="middle">${lab.p} p⁺</text><text x="300" y="147" fill="white" text-anchor="middle">${lab.n} n⁰</text><circle cx="300" cy="130" r="95" fill="none" stroke="#4b6680" stroke-dasharray="5 7"/>`;for(let j=0;j<lab.e;j++){let a=j/Math.max(lab.e,1)*Math.PI*2;draw+=atom(300+95*Math.cos(a),130+95*Math.sin(a),'e−',10)}h=svg(draw,'atom')+`<div class="stats"><div><b>${el[0]}</b>${t(el[1],el[2])}</div><div><b>Z = ${lab.p}</b>A = ${lab.p+lab.n}</div><div><b>${t('ประจุ','Charge')} ${charge>0?'+':''}${charge}</b>${t('หน่วยประจุพื้นฐาน','elementary charge units')}</div></div>`+note('จุดอิเล็กตรอนวางเป็นวงเพื่อให้นับง่าย ไม่ใช่วงโคจรหรือการจัดเรียงอิเล็กตรอนจริง เลขมวลไม่ใช่มวลอะตอมเฉลี่ย','Electrons are placed around a circle for counting, not actual orbits or shell arrangements. Mass number is not average atomic mass.')}
if(i===2){let el=elems[lab.element];h=`<div class="tableScroll"><div class="periodic">${Array.from({length:18},(_,j)=>`<small style="grid-column:${j+1};grid-row:1">${j+1}</small>`).join('')}${elems.map((el,j)=>`<button class="element ${el[5]} ${j===lab.element?'chosen':''}" style="grid-column:${el[3]};grid-row:${el[4]+1}" onclick="lab.element=${j};updateSim()"><small>${j+1}</small><b>${el[0]}</b></button>`).join('')}</div></div><div class="stats"><div><b>${el[0]} · ${t(el[1],el[2])}</b>Z = ${lab.element+1}</div><div><b>${t('หมู่','Group')} ${el[3]}</b>${t('คาบ','Period')} ${el[4]}</div><div><b>${cat(el[5])}</b>${t('ประเภทธาตุ','Element category')}</div></div>`+note('ไฮโดรเจนอยู่หมู่ 1 แต่เป็นอโลหะ ส่วน B และ Si ในตารางย่อนี้เป็นกึ่งโลหะ','Hydrogen is in group 1 but is a non-metal. B and Si in this excerpt are metalloids.')}
if(i===3){let k=lab.particle;h=svg(molecule(k,300,120),k)+`<div class="result">${k==='He'?t('อะตอมของธาตุ','Atom of an element'):k==='Na+'||k==='Cl−'?t('ไอออนอะตอมเดี่ยว','Monatomic ion'):k==='H2O'?t('โมเลกุลของสารประกอบ','Molecule of a compound'):t('โมเลกุลของธาตุ','Molecule of an element')}</div>`+note('O₂ และ O₃ มีแต่อะตอมออกซิเจน จึงเป็นรูปของธาตุออกซิเจน ส่วน Na⁺ มี 11 โปรตอน 10 อิเล็กตรอน และ Cl⁻ มี 17 โปรตอน 18 อิเล็กตรอน','O₂ and O₃ contain only oxygen atoms, so both are forms of the element oxygen. Na⁺ has 11 protons and 10 electrons; Cl⁻ has 17 protons and 18 electrons.')}
if(i===4){let f=lab.formula,n=lab.count,counts={H2O:{H:2,O:1},CO2:{C:1,O:2},NH3:{N:1,H:3},NaCl:{'Na⁺':1,'Cl⁻':1}}[f];let draw='';for(let j=0;j<n;j++)draw+=f==='NH3'?atom(100+j%3*190,60+Math.floor(j/3)*130,'N')+atom(80+j%3*190,85+Math.floor(j/3)*130,'H',12)+atom(120+j%3*190,85+Math.floor(j/3)*130,'H',12)+atom(100+j%3*190,35+Math.floor(j/3)*130,'H',12):molecule(f,100+j%3*190,60+Math.floor(j/3)*130);h=f==='NaCl'?lattice():svg(draw,f);h+=`<div class="result">${n}${f} → ${Object.entries(counts).map(([k,v])=>`${k}: ${n*v}`).join(' · ')}</div>`+note(f==='NaCl'?'ตัวเลขด้านบนคือจำนวนไอออนตามหน่วยสูตรที่เลือก ไม่ใช่จำนวนไอออนในภาพผลึก':'ตัวเลขแสดงจำนวนอะตอมรวมในโมเลกุลที่เลือก',f==='NaCl'?'Counts above represent the selected formula units, not all ions in the lattice illustration.':'Counts show the total atoms in the selected molecules.')}
if(i===5){let m=lab.method,labels={evap:['น้ำออกเป็นไอ → เหลือเกลือ','Water escapes as vapour → salt remains'],filter:['น้ำและไอออนละลายผ่านกระดาษกรอง → ยังเป็นน้ำเกลือ','Water and dissolved ions pass through → still salt solution'],distill:['ไอน้ำควบแน่น → ได้น้ำแยกจากเกลือ','Water vapour condenses → water is separated from salt'],electro:['2H₂O → 2H₂ + O₂ : เกิดสารใหม่','2H₂O → 2H₂ + O₂: new substances form']};h=`<div class="flow"><div>${m==='electro'?'H₂O':t('น้ำเกลือ','Salt solution')}</div><strong>→</strong><div>${tr(labels[m])}</div></div>`+(m==='electro'?svg(molecule('H2',150,120)+molecule('H2',300,120)+molecule('O2',450,120),'products'):m==='filter'?particles('salt'):lattice())+`<div class="result">${m==='electro'?t('การเปลี่ยนแปลงทางเคมี','Chemical change'):t('กระบวนการทางกายภาพ','Physical process')}</div>`+note('เป็นการจำลองแนวคิด ไม่ใช่คู่มือทดลองจริง การแยกน้ำด้วยไฟฟ้าต้องใช้เงื่อนไขและอุปกรณ์ที่เหมาะสมภายใต้การดูแลของครู','Conceptual simulation, not a practical procedure. Water electrolysis requires suitable conditions and equipment under teacher supervision.')}
if(i===6){let {a,b,c}=lab,ok=a===c&&2*b===c;h=`<div class="equation">${a}H₂ + ${b}O₂ → ${c}H₂O</div><div class="reaction">${svg(Array.from({length:a},(_,j)=>molecule('H2',80+j*130,65)).join('')+Array.from({length:b},(_,j)=>molecule('O2',80+j*130,190)).join(''),'reactants')}<b>→</b>${svg(Array.from({length:c},(_,j)=>molecule('H2O',80+j*130,120)).join(''),'products')}</div><table><tr><th>${t('ธาตุ','Element')}</th><th>${t('ก่อน','Before')}</th><th>${t('หลัง','After')}</th></tr><tr><td>H</td><td>${2*a}</td><td>${2*c}</td></tr><tr><td>O</td><td>${2*b}</td><td>${c}</td></tr></table><div class="result ${ok?'good':'bad'}">${ok?t('✓ สมดุล','✓ Balanced'):t('ยังไม่สมดุล','Not balanced')}</div>`+note('อัตราส่วนสัมประสิทธิ์จำนวนเต็มอย่างต่ำคือ 2 : 1 : 2 สำหรับปริมาณสาร: H₂ 4 g + O₂ 32 g → H₂O 36 g (ใช้มวลอะตอมโดยประมาณ H=1, O=16)','The lowest whole-number coefficient ratio is 2 : 1 : 2. For macroscopic amounts: 4 g H₂ + 32 g O₂ → 36 g H₂O (approximate atomic masses H=1, O=16).')}
$('sim').innerHTML=h}
